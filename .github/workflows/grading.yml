name: Python Assignment Autograding

on:
  push:
    branches:
      - main

env:
  ASSIGNMENT: assignment01

jobs:
  public-grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Public Tests
        continue-on-error: true
        run: |
          PYTHONPATH="$ASSIGNMENT" pytest "$ASSIGNMENT/test_public.py" \
            --json-report \
            --json-report-file=public_report.json \
            --tb=short

      - name: Calculate Public Score
        run: |
          python calculate_public_score.py