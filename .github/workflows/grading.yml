name: Python Assignment Autograding

on:
  push:
    branches:
      - main
    paths:
      - 'assignment*/**'

jobs:

  # =====================================================
  # 1. 이번 Push에서 변경된 과제 찾기
  # =====================================================

  detect-assignments:
    runs-on: ubuntu-latest

    outputs:
      assignments: ${{ steps.detect.outputs.assignments }}

    steps:

      - name: Checkout student code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 커밋 기록 전부 가져오기

      - name: Detect changed assignments
        id: detect # 코드에서 참조하기 위한 이름
        env: # GitHub 가 자동으로 제공하는 커밋 정보
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import subprocess


          before = os.environ["BEFORE_SHA"]
          current = os.environ["CURRENT_SHA"]


          # -------------------------------------------------
          # 변경된 파일 목록 가져오기
          # -------------------------------------------------

          if before == "0000000000000000000000000000000000000000":

              # Repository의 첫 Push일 경우
              command = [
                  "git",
                  "show",
                  "--pretty=",
                  "--name-only",
                  current
              ]

          else: 
          # git diff --name-only <before> <current>

              command = [
                  "git",
                  "diff",
                  "--name-only",
                  before,
                  current
              ]

          # 위에서 만든 명령어 실제 실행
          result = subprocess.run(
              command,
              capture_output=True,
              text=True,
              check=True
          )

          # 변경된 파일 목록 만들기
          changed_files = [
              line.strip()
              for line in result.stdout.splitlines()
              if line.strip()
          ]


          print()
          print("==========================================")
          print("             Changed Files")
          print("==========================================")

          for file in changed_files:
              print(file)


          # -------------------------------------------------
          # assignmentXX 폴더만 추출
          # -------------------------------------------------

          pattern = re.compile(
              r"^(assignment\d+)/"
          )


          assignments = set() # 중복 없는 집합


          for file in changed_files:

              match = pattern.match(file)

              if match:

                  assignments.add(
                      match.group(1)
                  )


          assignments = sorted(assignments)


          # -------------------------------------------------
          # 실제 채점 파일이 존재하는 과제만 사용
          # -------------------------------------------------

          valid_assignments = []


          for assignment in assignments:

              test_file = (
                  f"{assignment}/test_public.py"
              )

              config_file = (
                  f"{assignment}/grading_config.json"
              )


              if (
                  os.path.isfile(test_file)
                  and os.path.isfile(config_file)
              ):

                  valid_assignments.append(
                      assignment
                  )


              else:

                  print(
                      f"[SKIP] {assignment}: "
                      f"채점 파일이 완전하지 않습니다."
                  )


          print()
          print("==========================================")
          print("        Public Test Target")
          print("==========================================")


          if valid_assignments:

              for assignment in valid_assignments:

                  print(
                      f"[TARGET] {assignment}"
                  )

          else:

              print(
                  "채점할 assignment가 없습니다."
              )


          # 빈 Matrix 방지용
          if not valid_assignments:

              valid_assignments = [
                  "__none__"
              ]


          matrix_json = json.dumps(
              valid_assignments,
              separators=(",", ":")
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as f:

              f.write(
                  f"assignments={matrix_json}\n"
              )

          PY


  # =====================================================
  # 2. 변경된 과제별 Public Test
  # =====================================================

  public-grade:

    needs:
      - detect-assignments

    strategy:
      fail-fast: false

      matrix:
        assignment: ${{ fromJSON(needs.detect-assignments.outputs.assignments) }}

    runs-on: ubuntu-latest

    # 채점할 과제가 없으면 Job을 건너뜀
    if: ${{ needs.detect-assignments.outputs.assignments != '["__none__"]' }}

    steps:

      - name: Checkout student code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.11'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-json-report

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi


      - name: Validate Assignment
        env:
          ASSIGNMENT: ${{ matrix.assignment }}

        run: |
          if [ ! -f "$ASSIGNMENT/solution.py" ]; then
            echo "solution.py가 없습니다."
            exit 1
          fi

          if [ ! -f "$ASSIGNMENT/test_public.py" ]; then
            echo "test_public.py가 없습니다."
            exit 1
          fi

          if [ ! -f "$ASSIGNMENT/grading_config.json" ]; then
            echo "grading_config.json이 없습니다."
            exit 1
          fi


      - name: Check Python Syntax
        env:
          ASSIGNMENT: ${{ matrix.assignment }}

        run: |
          python -m py_compile "$ASSIGNMENT/solution.py"


      - name: Run Public Tests
        id: public_tests
        continue-on-error: true

        env:
          ASSIGNMENT: ${{ matrix.assignment }}

        run: |
          PYTHONPATH="$ASSIGNMENT" \
          pytest "$ASSIGNMENT/test_public.py" \
            --json-report \
            --json-report-file=public_report.json \
            --tb=short


      - name: Calculate Public Score
        env:
          ASSIGNMENT: ${{ matrix.assignment }}

        run: |
          python calculate_public_score.py